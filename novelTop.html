*{
font-family: 'Shippori Mincho', serif;
color: #FFF;
font-size: 12px;
font-weight: 400;
letter-spacing: 0.05em;
line-height: 2.0em;

padding: 0;
margin: 0;
list-style-type: none;
text-decoration:none;

body{
width: 100vw;
overflow-x: hidden;
}

body:before{
background-image: linear-gradient(140deg, rgba(190, 127, 108, 1), rgba(130, 30, 76, 1) 48%, rgba(26, 22, 22, 1));
background-size: cover;
content: "";
display: block;
position: fixed;
top: 0;
left: 0;
z-index: -99;
width: 100%;
height: 100vh;
}

.wrap{
max-width: 600px;
min-height: 100vh;
padding: 40px 25px 0;
margin: 50px auto 30px;
}

a{
transition: 0.2s;
background-color: rgba(0,0,0,0.4);
}

a:hover{
background-color: #FFF;
color: #682242;
}

strong{
font-weight: 700;
border-bottom: 1px solid #FFF;
}

header{
width: 100%;
text-align: center;
}

.nav{
width: 100%;
display: flex;
justify-content: center;
gap: 15px;
}

.nav li a{
font-size: 14px;
background-color: transparent;
}

.nav li a:hover{
background-color: transparent;
color: #682242;
}

.child-wrap{
padding-top: 0;
margin-top: 40px;
}

.child-nav{
width: 100%;
border: 1px solid #FFF;
padding: 5px 0;
gap: 10%;
}

h2{
font-size: 18px;
text-align: center;
position: relative;
margin-bottom: 40px;
font-weight: 600;
}

h2:after{
content: '';
width: 15px;
height: 1px;
background-color: #FFF;
position: absolute;
top: 50px;
left: 50%;
transform: translate(-50%, 0);
}

h3{
font-size: 14px;
font-weight: 600;
padding-bottom: 20px;
}

main{
width: 100%;
margin: 50px auto 30px;
}

.section{
width: 100%;
margin: 0 auto 60px;
padding: 0 5%;
}

.long{
width: 100%;
border: 1px solid #FFF;
padding: 20px 30px;
}

.long+.long{
margin-top: 20px;
}

.caption{
font-size: 11px;
opacity: 0.8;
margin-top: 5px;
}

footer{
text-align: center;
margin: 120px auto 60px;
font-size: 11px;
}

@media screen and (max-width: 500px) {
.wrap{
margin: 20px auto 30px;
}
.child-wrap{
margin-top: 20px;
}
main{
margin-top: 30px;
}
.section{
padding-left: 5%;
padding-right: 5%;
}
}
</style>
</head>

  <footer>
