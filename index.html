<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLDROSE</title>
<style type="text/css">
/* --- （いまお持ちのCSSをそのままここに挟む） --- */
@import url('https://fonts.googleapis.com/css2?family=Oooh+Baby&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap');

*{
font-family: 'Shippori Mincho', serif;
color: #FFF;
font-size: 12px;
font-weight: 400;
letter-spacing: 0.05em;
line-height: 2.0em;
box-sizing: border-box;
padding: 0;
margin: 0;
list-style-type: none;
text-decoration:none;
}

body{
width: 100vw;
overflow-x: hidden;
}

body:before{
background-image: linear-gradient(140deg, rgba(190, 127, 108, 1), rgba(130, 30, 76, 1) 48%, rgba(26, 22, 22, 1));
background-size: cover;
content: "";
display: block;
position: fixed;
top: 0;
left: 0;
z-index: -99;
width: 100%;
height: 100vh;
}

.wrap{
max-width: 600px;
min-height: 100vh;
padding: 40px 25px 0;
margin: 50px auto 30px;
}

a{
transition: 0.2s;
background-color: rgba(0,0,0,0.4);
}

a:hover{
background-color: #FFF;
color: #682242;
}

strong{
font-weight: 700;
border-bottom: 1px solid #FFF;
}

header{
width: 100%;
text-align: center;
}

.nav{
width: 100%;
display: flex;
justify-content: center;
gap: 15px;
}

.nav li a{
font-size: 14px;
background-color: transparent;
}

.nav li a:hover{
background-color: transparent;
color: #682242;
}

.ttl{
width: 100%;
height: 75px;
position: relative;
margin-bottom: 10px;
}

.square{
width: 200px;
height: 75px;
border: 1px solid #FFF;
background-color: transparent;
margin: 0 auto;
}

h1{
font-family: 'Oooh Baby', sans-serif;
white-space: nowrap;
font-size: 40px;
letter-spacing: 0;
position: absolute;
top: -30%;
left: 49%;
transform: translate(-50%, 0) rotate(-10deg);
}

.ja{
font-size: 11px;
display: block;
position: absolute;
top: 50px;
left: 50%;
transform: translate(-50%, 0);
}

.update{
width: fit-content;
max-width: 100%;
background-color: rgba(0,0,0,0.15);
padding: 10px 30px;
margin: 40px auto 50px;
}

h2{
font-size: 18px;
text-align: center;
position: relative;
margin-bottom: 40px;
font-weight: 600;
}

h2:after{
content: '';
width: 15px;
height: 1px;
background-color: #FFF;
position: absolute;
top: 50px;
left: 50%;
transform: translate(-50%, 0);
}

main{
width: 100%;
margin: 50px auto 30px;
}

.section{
width: 100%;
margin: 0 auto 60px;
padding: 0 5%;
}

footer{
text-align: center;
margin: 120px auto 60px;
font-size: 11px;
}
</style>
</head>
<body>

<div class="wrap">

  <!-- ヘッダーメニュー -->
  <header>
    <div class="ttl">
      <div class="square"></div>
      <h1>OLDROSE</h1>
      <span class="ja">サイトの説明やサブタイトル</span>
    </div>
    
    <ul class="nav">
      <li><a href="#">HOME</a></li>
      <li><a href="#">NOVEL</a></li>
      <li><a href="#">ABOUT</a></li>
    </ul>
  </header>

  <!-- メインコンテンツ -->
  <main>
    <div class="section">
      <h2>WELCOME</h2>
      <p style="text-align: center;">
        ここにサイトのウェルカムメッセージや、<br>
        お話を置く場所です。
      </p>
    </div>
  </main>

  <!-- フッター -->
  <footer>
    <p>Copyright &copy; OLDROSE All rights reserved.</p>
  </footer>

</div>

</body>
</html>
